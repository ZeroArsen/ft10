name: Bug report
description: A score was counted wrong, or something else doesn't work.
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Minecraft version and FT10 version.
      placeholder: Minecraft 26.2, FT10 0.1.0
    validations:
      required: true
  - type: input
    id: server
    attributes:
      label: Server address
      description: Where it happened. Kill detection depends on the server's death messages.
      placeholder: play.example.net
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: message
    attributes:
      label: Kill message
      description: >
        If a kill wasn't counted (or was counted wrong), paste the exact kill/death message from chat
        or attach a screenshot of it. This lets us add the server's format.
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Relevant lines from logs/latest.log (search for "ft10").
      render: text
