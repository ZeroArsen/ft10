name: Release

# Push a tag like v0.1.0 to build every Minecraft version, attach the jars to a GitHub Release and
# upload them to Modrinth (one Modrinth version per Minecraft range).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The wrapper can lose its executable bit when committed from Windows.
      - run: chmod +x ./gradlew

      - name: Build and test every version
        run: ./gradlew build --stacktrace

      - name: Attach jars to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: versions/*/build/libs/*.jar
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

      # `secrets` can't be used in a step-level `if`, so it is mapped to env first.
      # Forks and token-less repos skip this step instead of failing the release.
      - name: Publish to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        if: ${{ env.MODRINTH_TOKEN != '' }}
        run: ./gradlew modrinth --no-configuration-cache --stacktrace
