name: Modrinth page

# Run by hand (Actions → Modrinth page → Run workflow, or `gh workflow run modrinth-page.yml`) to copy
# MODRINTH.md to the Modrinth project page without making a release. Releases sync it too.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew

      - name: Sync the project page
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: ./gradlew :26.2:modrinthSyncBody --no-configuration-cache --stacktrace
